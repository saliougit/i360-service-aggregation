server:
  port: 8090 # Port for the aggregation service

gateway:
  url: ${GATEWAY_URL:http://localhost:8080}

spring:
  main:
    allow-bean-definition-overriding: true
    web-application-type: reactive
  application:
    name: service-aggregation
  security:
    jwt:
      secret: ${JWT_SECRET:58703273357638792F423F4528482B4D6251655468576D5A7134743677397A24}
      expiration: ${JWT_EXPIRATION:86400000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Configuration URLs for OpenAPI
openapi:
  dev-url: http://localhost:8080
  prod-url: https://api.innov4africa.sn

keycloak:
  auth-server-url: ${KEYCLOAK_SERVER_URL:https://137.184.94.79:8443/auth}
  realm: ${KEYCLOAK_REALM:Ibanking}
  resource: ${KEYCLOAK_CLIENT_ID:ibanking-backoffice}
  public-client: true
  use-resource-role-mappings: true
  bearer-only: true
  ssl-required: external
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

# Configuration des services externes
services:
  ipay:
    url: ${IPAY_SERVICE_URL}
    soap-endpoint: /cash-ws/CashWalletServiceWS # Endpoint SOAP réel
    connection-timeout: 30000  # Timeout augmenté car service SOAP
    read-timeout: 30000
    ssl:
      verify: false  # Nécessaire car utilise InsecureTrustManagerFactory

  ibanking:
    url: https://137.184.94.79:8443  # URL de Keycloak/iBanking
    api-version: v1
    connection-timeout: 5000
    read-timeout: 5000
    auth:
      server-url: ${KEYCLOAK_SERVER_URL:https://137.184.94.79:8443/auth}
      realm: ${KEYCLOAK_REALM:Ibanking}
      client-id: ${KEYCLOAK_CLIENT_ID:ibanking-backoffice}

  ishop:
    url: https://ibusinesscompanies.com:8443  # URL réelle trouvée dans IShopService
    api-version: v1
    connection-timeout: 5000
    read-timeout: 5000
    endpoints:
      product: /mobile-ws/product
      auth: /mobile-ws/auth

resilience4j:
  circuitbreaker:
    instances:
      ipayService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30000
      ibankingService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30000
      ishopService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30000

  retry:
    instances:
      ipayService:
        maxAttempts: 3
        waitDuration: 1000
      ibankingService:
        maxAttempts: 3
        waitDuration: 1000
      ishopService:
        maxAttempts: 3
        waitDuration: 1000

logging:
  level:
    com.innov4africa: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG